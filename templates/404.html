{% extends "base.html" %}
{% block title %}Page Not Found (404) — OrderLess{% endblock %}
{% block body %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="menu-card text-center p-4 p-md-5 animate-scale-in" style="max-width: 500px; width: 100%; border-radius: var(--radius-2xl); box-shadow: var(--shadow-xl); background: var(--glass-bg-solid); border: var(--glass-border); flex-direction: column; gap: 0;">
        <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">🔍</div>
        <h1 style="font-family: var(--font-heading); font-size: 2rem; font-weight: 900; color: var(--deepest); margin-bottom: 0.4rem;">
            404 — Page Not Found
        </h1>
        <p class="text-muted" style="font-size: 0.92rem; margin-bottom: 1.8rem; line-height: 1.5;">
            The requested page or dining table does not exist. Please check your QR code or navigate back.
        </p>
        <a href="/" class="btn-premium-primary">
            <i class="bi bi-house-door-fill"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
